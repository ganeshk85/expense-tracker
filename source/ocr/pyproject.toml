[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker-ocr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.1.0",
    "pillow>=11.0.0",
    "pillow-heif>=0.18.0",
    "pdf2image>=1.17.0",
    "opencv-python-headless>=4.10.0",
    "pytesseract>=0.3.13",
    "pyzbar>=0.1.9",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
# Without this, `from src.xxx import ...` in the test files fails with
# ModuleNotFoundError unless the package has been `pip install -e`'d first —
# this makes `pytest` work directly from source/ocr/ with no install step.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
